<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie 3D - Portfolio Blender</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- CSS intégré directement -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f1115;
            color: #e1e1e6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .portfolio-header {
            text-align: center;
            padding: 3rem 1rem 2rem 1rem;
        }

        .portfolio-header h1 {
            font-size: 2.5rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .portfolio-header p {
            color: #8b949e;
            font-size: 1.1rem;
        }

        .gallery-container {
            max-width: 1200px;
            width: 90%;
            margin: 0 auto 4rem auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
        }

        .gallery-item {
            position: relative;
            border-radius: 12px;
            overflow: hidden;
            background-color: #161b22;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .gallery-item:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            aspect-ratio: 16 / 9;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 17, 21, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .overlay span {
            color: #ffffff;
            font-weight: 600;
            font-size: 1rem;
            border: 2px solid #ffffff;
            padding: 0.6rem 1.2rem;
            border-radius: 30px;
            letter-spacing: 0.5px;
        }

        .gallery-item:hover .overlay {
            opacity: 1;
        }

        .portfolio-footer {
            text-align: center;
            padding: 1.5rem;
            background-color: #0b0d10;
            color: #484f58;
            font-size: 0.9rem;
        }

        .lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .lightbox:target {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .lightbox .close {
            position: absolute;
            top: 2rem;
            right: 2.5rem;
            font-size: 3rem;
            color: #ffffff;
            text-decoration: none;
            font-weight: 300;
            transition: color 0.2s ease;
        }

        .lightbox .close:hover {
            color: #58a6ff;
        }
    </style>
</head>
<body>

    <header class="portfolio-header">
        <h1>Mon Portfolio Blender</h1>
        <p>Rendus 3D, modélisations hard-surface et packshots produits</p>
    </header>

    <main class="gallery-container">
        
        <!-- Élément 1 : Pot cosmétique -->
        <div class="gallery-item">
            <a href="#img1">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" data-original="lan2.png" alt="Pot cosmétique texturé bleu et couvercle noir">
                <div class="overlay">
                    <span>Voir le rendu</span>
                </div>
            </a>
        </div>

        <!-- Élément 2 : Flacon sur fond bleu -->
        <div class="gallery-item">
            <a href="#img2">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Flacon minimaliste sur fond bleu studio">
                <div class="overlay">
                    <span>Voir le rendu</span>
                </div>
            </a>
        </div>

        <!-- Élément 3 : Flacon bordeaux -->
        <div class="gallery-item">
            <a href="#img3">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Flacon à facettes bordeaux et bouchon noir">
                <div class="overlay">
                    <span>Voir le rendu</span>
                </div>
            </a>
        </div>

        <!-- Élément 4 : Smartphone / Tablette -->
        <div class="gallery-item">
            <a href="#img4">
                <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Modélisation de smartphone sur fond noir">
                <div class="overlay">
                    <span>Voir le rendu</span>
                </div>
            </a>
        </div>

    </main>

    <footer class="portfolio-footer">
        <p>Propulsé par GitHub Pages &bull; Conçu sous Blender</p>
    </footer>

    <!-- LIGHTBOX -->
    <div id="img1" class="lightbox">
        <a href="#" class="close">&times;</a>
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Pot cosmétique texturé bleu">
    </div>

    <div id="img2" class="lightbox">
        <a href="#" class="close">&times;</a>
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Flacon minimaliste sur fond bleu studio">
    </div>

    <div id="img3" class="lightbox">
        <a href="#" class="close">&times;</a>
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Flacon à facettes bordeaux et bouchon noir">
    </div>

    <div id="img4" class="lightbox">
        <a href="#" class="close">&times;</a>
        <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" alt="Modélisation de smartphone sur fond noir">
    </div>

</body>
</html>
