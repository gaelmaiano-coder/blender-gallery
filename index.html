<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galerie 3D - Portfolio Blender</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="portfolio-header">
        <h1>Ma progression Blender</h1>
        <p>1 jour 1 rendu</p>
    </header>

    <main class="gallery-container">
        
        <!-- Élément 1 -->
        <div class="gallery-item">
            <a href="#img1">
                <img src="lan2.png" alt="Pot cosmétique texturé bleu">
                <div class="overlay">
                    <span>Voir le rendu</span>
                </div>
            </a>
        </div>
        
        <!-- Élément 1 bis -->
        <div class="gallery-item">
            <a href="#img1bis"> <!-- Correction de la balise ouvrante -->
                <img src="room.png" alt="Pièce d'apprentissage archviz sous Blender">
                <div class="overlay">
                    <span>Voir le rendu</span>
                </div>
            </a>
        </div>

        <!-- Élément 2 -->
        <div class="gallery-item">
            <a href="#img2">
                <img src="flacon.png" alt="Flacon minimaliste sur fond bleu">
                <div class="overlay">
                    <span>Voir le rendu</span>
                </div>
            </a>
        </div>

        <!-- Élément 3 -->
        <div class="gallery-item">
            <a href="#img3">
                <img src="flacon3.png" alt="Flacon à facettes bordeaux">
                <div class="overlay">
                    <span>Voir le rendu</span>
                </div>
            </a>
        </div>

        <!-- Élément 4 -->
        <div class="gallery-item">
            <a href="#img4">
                <img src="tel.png" alt="Modélisation de smartphone">
                <div class="overlay">
                    <span>Voir le rendu</span>
                </div>
            </a>
        </div>
         <!-- Élément 4 -->
        <div class="gallery-item">
            <a href="#img5">
                <img src="satch.png" alt="Modélisation de smartphone">
                <div class="overlay">
                    <span>Voir le rendu</span>
                </div>
            </a>
        </div>


    </main>

    <footer class="portfolio-footer">
        <p>Propulsé par GitHub Pages &bull; Conçu sous Blender</p>
    </footer>

    <!-- LIGHTBOX (Zoom plein écran) -->
    <div id="img1" class="lightbox">
        <a href="#" class="close">&times;</a>
        <img src="lan2.png" alt="Pot cosmétique texturé bleu">
    </div>

    <div id="img1bis" class="lightbox">
        <a href="#" class="close">&times;</a>
        <img src="room.png" alt="Pièce d'apprentissage archviz sous Blender">
    </div>

    <div id="img2" class="lightbox">
        <a href="#" class="close">&times;</a>
        <img src="flacon.png" alt="Flacon minimaliste sur fond bleu">
    </div>

    <div id="img3" class="lightbox">
        <a href="#" class="close">&times;</a>
        <img src="flacon3.png" alt="Flacon à facettes bordeaux">
    </div>

    <div id="img4" class="lightbox">
        <a href="#" class="close">&times;</a>
        <img src="tel.png" alt="Modélisation de smartphone">
    </div>
        <div id="img5" class="lightbox">
        <a href="#" class="close">&times;</a>
        <img src="tel.png" alt="pièce lens ">
    </div>

</body>
</html>
